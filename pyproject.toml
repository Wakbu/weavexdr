[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-xdr-graph"
version = "0.1.0"
description = "Minimal execution-graph skeleton for a personal AI XDR"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "pydantic>=2.11,<3",
    "yara-python>=4.5,<5",
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "pywin32>=311; sys_platform == 'win32'",
    "pyyaml>=6,<7",
    "reportlab>=4.2,<5",
    "cryptography>=50,<51",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pyinstaller>=6,<7"]

[project.scripts]
xdr-graph = "xdr_graph.cli:main"
xdr-service = "xdr_graph.windows_service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xdr_graph"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "xdr_graph/config"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
