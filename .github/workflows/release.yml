name: release

on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].[0-9]+"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
      - run: .\.venv\Scripts\python.exe -m pytest -q
      - shell: powershell
        run: .\scripts\build_windows_package.ps1 -Version "${{ github.ref_name }}"
      - run: .\.venv\Scripts\python.exe scripts\validate_release.py
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/weavexdr-${{ github.ref_name }}-windows.zip
            dist/weavexdr-${{ github.ref_name }}-manifest.json
          generate_release_notes: true
